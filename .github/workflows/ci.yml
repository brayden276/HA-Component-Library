name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Vitest Suite
        run: npm test

      - name: Build Library
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Real Browser Smoke Test
        run: npm run test:browser

      - name: Validate Production Build Output
        run: |
          test -f dist/ha-component-library.js || (echo "dist/ha-component-library.js missing!" && exit 1)
          test -f hacs.json || (echo "hacs.json missing!" && exit 1)

      - name: HACS Action Validation
        uses: hacs/action@main
        with:
          category: plugin
